[package]
name = "switchboard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Switchboard hosting service: supervises CLI agent tasks and syncs to clients"

[[bin]]
name = "switchboard-server"
path = "src/main.rs"

[dependencies]
switchboard-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
time = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
futures = "0.3"
portable-pty = "0.9"
vt100 = "0.15"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
tokio-tungstenite = "0.24"
