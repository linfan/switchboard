[package]
name = "switchboard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Switchboard hosting service: supervises CLI agent tasks and syncs to clients"

[[bin]]
name = "switchboard-server"
path = "src/main.rs"

[dependencies]
switchboard-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
futures = "0.3"
portable-pty = "0.9"
vt100 = "0.15"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
tokio-tungstenite = "0.24"
