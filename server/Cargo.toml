[package]
name = "switchboard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Switchboard hosting service: supervises CLI agent tasks and syncs to clients"

[[bin]]
name = "switchboard-server"
path = "src/main.rs"

[dependencies]
switchboard-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
time = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
futures = "0.3"
portable-pty = "0.9"
vt100 = "0.15"
libc = "0.2"
# `__rustls-tls` enables the rustls Connector + connect_async_tls_with_config
# without bundling any CA set (we pin a custom verifier), matching the server's
# rustls 0.23/ring stack.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
http-body-util = "0.1"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
# Raw TLS client used by the repeater E2E tests to drive REST/WS through the
# tunnel (matches the server's rustls 0.23/ring stack via tokio-rustls 0.26).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
