# Standalone workspace: keep this crate out of the root Cargo workspace
# (which only builds the server/shared crates) so `tauri` tooling resolves it.
[workspace]

[package]
name = "switchboard-client"
version = "0.3.0"
edition = "2021"
description = "Desktop client for switchboard"
authors = ["switchboard"]

[lib]
name = "switchboard_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Formats the build-time stamp baked in by build.rs.
time = "0.3"

[dependencies]
# `protocol-asset` serves the media-preview cache to the webview over `asset:`
# (Range-capable, so video seeks without loading the file into webview memory).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "fs", "net", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "http2", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
switchboard-shared = { path = "../../shared" }
futures-util = "0.3"
base64 = "0.22"
