# Standalone workspace: keep this crate out of the root Cargo workspace
# (which only builds the server/shared crates) so `tauri` tooling resolves it.
[workspace]

[package]
name = "switchboard-client"
version = "0.1.0"
edition = "2021"
description = "Desktop client for switchboard"
authors = ["switchboard"]

[lib]
name = "switchboard_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
base64 = "0.22"
