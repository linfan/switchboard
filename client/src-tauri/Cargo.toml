[package]
name = "agent-manage-client"
version = "0.1.0"
edition = "2021"
description = "Desktop client for agent-manage"
authors = ["agent-manage"]

[lib]
name = "agent_manage_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
