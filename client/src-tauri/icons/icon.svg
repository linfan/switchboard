<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7686a0"/>
      <stop offset="1" stop-color="#465268"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#1b222c"/>
      <stop offset="1" stop-color="#141a22"/>
    </linearGradient>
    <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2a323d"/>
      <stop offset="1" stop-color="#232a34"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824x824 body centered in 1024 canvas with transparent margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <g clip-path="url(#body)">
    <g transform="translate(100,100) scale(0.8046875)">
      <!-- back window -->
      <g opacity="0.55" filter="url(#drop)">
        <rect x="128" y="150" width="624" height="512" rx="32" fill="url(#win)" stroke="#30363d" stroke-width="2"/>
        <path d="M128 182 a32 32 0 0 1 32 -32 h560 a32 32 0 0 1 32 32 v44 h-624 z" fill="url(#barg)"/>
        <circle cx="176" cy="196" r="14" fill="#f85149"/>
        <circle cx="220" cy="196" r="14" fill="#d29922"/>
        <circle cx="264" cy="196" r="14" fill="#3fb950"/>
      </g>

      <!-- mid window -->
      <g opacity="0.8" filter="url(#drop)">
        <rect x="208" y="240" width="624" height="512" rx="32" fill="url(#win)" stroke="#30363d" stroke-width="2"/>
        <path d="M208 272 a32 32 0 0 1 32 -32 h560 a32 32 0 0 1 32 32 v44 h-624 z" fill="url(#barg)"/>
        <circle cx="256" cy="286" r="14" fill="#f85149"/>
        <circle cx="300" cy="286" r="14" fill="#d29922"/>
        <circle cx="344" cy="286" r="14" fill="#3fb950"/>
        <rect x="248" y="352" width="170" height="20" rx="10" fill="#8b949e" opacity="0.5"/>
        <rect x="248" y="392" width="270" height="20" rx="10" fill="#8b949e" opacity="0.3"/>
      </g>

      <!-- front window (active, detailed) -->
      <g filter="url(#drop)">
        <rect x="288" y="330" width="636" height="524" rx="34" fill="url(#win)" stroke="#3a424e" stroke-width="2"/>
        <path d="M288 364 a34 34 0 0 1 34 -34 h568 a34 34 0 0 1 34 34 v46 h-636 z" fill="url(#barg)"/>
        <circle cx="338" cy="374" r="15" fill="#f85149"/>
        <circle cx="384" cy="374" r="15" fill="#d29922"/>
        <circle cx="430" cy="374" r="15" fill="#3fb950"/>

        <!-- prompt line: chevron + command + cursor -->
        <path d="M330 458 l34 26 l-34 26" fill="none" stroke="#3fb950" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="392" y="470" width="250" height="28" rx="14" fill="#4c8bf5"/>
        <rect x="658" y="462" width="30" height="44" rx="6" fill="#e6e6e6"/>

        <!-- output lines -->
        <rect x="330" y="542" width="420" height="24" rx="12" fill="#8b949e" opacity="0.55"/>
        <rect x="330" y="590" width="290" height="24" rx="12" fill="#3fb950" opacity="0.85"/>
        <rect x="330" y="638" width="380" height="24" rx="12" fill="#8b949e" opacity="0.4"/>
        <rect x="330" y="686" width="230" height="24" rx="12" fill="#8b949e" opacity="0.4"/>
        <rect x="330" y="734" width="330" height="24" rx="12" fill="#8b949e" opacity="0.4"/>
      </g>
    </g>
  </g>
</svg>
