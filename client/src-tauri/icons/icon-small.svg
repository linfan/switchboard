<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgs" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d8daa"/>
      <stop offset="1" stop-color="#4a5670"/>
    </linearGradient>
    <linearGradient id="wins" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#222b37"/>
      <stop offset="1" stop-color="#19212b"/>
    </linearGradient>
    <clipPath id="bodys">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824x824 body centered in 1024 canvas with transparent margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgs)"/>

  <g clip-path="url(#bodys)">
    <g transform="translate(100,100) scale(0.8046875)">
      <!-- back window hint for the "multi" cue -->
      <rect x="150" y="132" width="724" height="150" rx="44" fill="#232c38" opacity="0.7"/>

      <!-- main terminal window, large & high-contrast -->
      <rect x="104" y="200" width="816" height="624" rx="60" fill="url(#wins)" stroke="#454f5c" stroke-width="4"/>
      <path d="M104 272 a60 60 0 0 1 60 -60 h696 a60 60 0 0 1 60 60 v58 h-816 z" fill="#2c3542"/>
      <circle cx="184" cy="258" r="22" fill="#f85149"/>
      <circle cx="252" cy="258" r="22" fill="#d29922"/>
      <circle cx="320" cy="258" r="22" fill="#3fb950"/>

      <!-- bold prompt: chevron + command bar + cursor -->
      <path d="M176 410 l64 46 l-64 46" fill="none" stroke="#3fb950" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="294" y="428" width="360" height="56" rx="28" fill="#4c8bf5"/>
      <rect x="686" y="416" width="60" height="80" rx="12" fill="#e6e6e6"/>

      <rect x="176" y="558" width="470" height="44" rx="22" fill="#8b949e" opacity="0.7"/>
      <rect x="176" y="632" width="330" height="44" rx="22" fill="#3fb950" opacity="0.9"/>
      <rect x="176" y="706" width="410" height="44" rx="22" fill="#8b949e" opacity="0.5"/>
    </g>
  </g>
</svg>
